name: unpack-samples
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/unpack_samples.py"
      - ".github/workflows/unpack-samples.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack preview PDFs
        run: python3 scripts/unpack_samples.py
      - name: Commit preview PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Add clinic preview PDFs"
            git push
          fi
